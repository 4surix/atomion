name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Les anciennes versions de Python ne sont pas disponibles sur les
        #  images de runners récentes (et inversement) : on associe donc
        #  explicitement chaque version à une image compatible.
        #  (ubuntu-20.04 n'existe plus ; ubuntu-latest pointe vers 24.04/26.04.)
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer le paquet et les dépendances de développement
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (unittest)
        run: python -m unittest discover -v -s tests
      - name: Couverture
        run: |
          coverage run -m unittest discover -s tests
          coverage report -m

  build:
    name: Build des distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer les outils de build
        run: python -m pip install --upgrade pip build twine
      - name: Construire le sdist et la wheel
        run: python -m build
      - name: Vérifier les métadonnées
        run: python -m twine check dist/*
