name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Les anciennes versions de Python ne sont pas disponibles sur les
        #  images de runners récentes (et inversement) : on associe donc
        #  explicitement chaque version à une image compatible.
        #  (ubuntu-20.04 n'existe plus ; ubuntu-latest pointe vers 24.04/26.04.)
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer le paquet et les dépendances de développement
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (unittest)
        run: python -m unittest discover -v -s tests
      - name: Couverture
        run: |
          coverage run -m unittest discover -s tests
          coverage report -m

  build:
    name: Build des distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer les outils de build
        run: python -m pip install --upgrade pip build twine
      - name: Construire le sdist et la wheel
        run: python -m build
      - name: Vérifier les métadonnées
        run: python -m twine check dist/*

  calculatrice:
    name: Calculatrice (MicroPython 1.9.4)
    runs-on: ubuntu-22.04
    env:
      MP_VERSION: v1.9.4
      MP_DIR: mp-1.9.4
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances de compilation
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libffi-dev

      - name: Mettre MicroPython en cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MP_DIR }}
          key: micropython-${{ env.MP_VERSION }}-unix-${{ runner.os }}

      - name: Compiler MicroPython 1.9.4 (mpy-cross + port unix)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MP_VERSION" https://github.com/micropython/micropython "$MP_DIR"
          make -C "$MP_DIR/mpy-cross" CFLAGS_EXTRA="-Wno-error -Wno-implicit-function-declaration"
          make -C "$MP_DIR/ports/unix" -j"$(nproc)" \
            CFLAGS_EXTRA="-Wno-error -Wno-implicit-function-declaration" \
            MICROPY_PY_FFI=0 MICROPY_PY_USSL=0 MICROPY_PY_BTREE=0

      - name: Localiser les binaires
        run: |
          echo "MPY_CROSS=$(find $MP_DIR/mpy-cross -type f -name mpy-cross | head -1)" >> "$GITHUB_ENV"
          echo "MICROPYTHON=$(find $MP_DIR/ports/unix -type f -name micropython | head -1)" >> "$GITHUB_ENV"

      - name: Générer atomion.py (fichier unique)
        run: python3 mk_file_calculatrice.py

      - name: Vérifier la compilation avec mpy-cross 1.9.4
        run: "$MPY_CROSS -o /tmp/atomion.mpy atomion.py"

      - name: Test de fumée sur MicroPython 1.9.4
        run: |
          mkdir -p /tmp/calculatrice
          cp atomion.py tests/smoke_calculatrice.py /tmp/calculatrice/
          cd /tmp/calculatrice
          "$GITHUB_WORKSPACE/$MICROPYTHON" smoke_calculatrice.py | tee resultat.txt
          grep -q '^OK$' resultat.txt
