[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomion"
version = "1.8.0"
description = "Manipulation facile d'atomes, d'ions, de molécules, d'équations et de réactions chimiques."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Asurix", email = "asurix@outlook.fr" },
]
keywords = [
    "chimie", "chemistry", "atome", "atom", "ion", "molecule", "molécule",
    "equation", "équation", "réaction", "oxydo-reduction", "acido-basique",
    "micropython", "calculatrice", "education",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/4surix/atomion"
Repository = "https://github.com/4surix/atomion"
Issues = "https://github.com/4surix/atomion/issues"
Changelog = "https://github.com/4surix/atomion/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# `calc` : génération du fichier unique pour calculatrices. `python_minifier`
calc = ["python-minifier>=3.4,<4"]
dev = [
    "python-minifier>=3.4,<4",
    "ruff>=0.6",
    "coverage[toml]>=7.0",
    "build>=1.0",
    "twine>=5.0",
    "pre-commit>=3.0",
]

[tool.setuptools.packages.find]
include = ["atomion*", "mk_file_calculatrice*"]

[tool.setuptools.package-data]
atomion = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    "atomion/elements.py",  # fichier de données généré
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (erreurs)
    "F",    # Pyflakes
    "W",    # pycodestyle (avertissements)
    "B",    # flake8-bugbear (pièges courants)
    "UP",   # pyupgrade (modernisation syntaxique)
    "PTH",  # flake8-use-pathlib (couvre PTH123)
    "RUF",  # règles spécifiques Ruff (couvre RUF023)
    "SIM",  # flake8-simplify (simplifications de code)
]
ignore = [
    # Règles historiques à retirer progressivement
    "E1",    # indentation (tabulations historiques)
    "E2",    # espaces
    "E3",    # lignes vides
    "E5",    # longueur de ligne / continuations
    "E7",    # instructions multiples sur une ligne
    "W1",    # indentation
    "F403",  # import * utilisé
    "F405",  # nom potentiellement indéfini (via import *)

    # Règles à garder ignorées pour MicroPython 1.9.4
    "F811",    # redéfinition d'un nom (nécessaire pour le mode calculatrice)
    "UP007",   # évite `X | Y` dans les annotations (`Union[X, Y]` pour MicroPython)
    "UP045",   # évite `X | None` dans les annotations (`Optional[X]` pour MicroPython)
    "RUF001",  # autorise les caractères Unicode mathématiques/chimiques (², ⁻, →) dans les chaînes
    "RUF002",  # autorise les caractères Unicode dans les docstrings
    "RUF003",  # autorise les caractères Unicode dans les commentaires
]

[tool.ruff.lint.per-file-ignores]
# MicroPython 1.9.4 ne supporte ni pathlib ni les f-strings
"atomion/**/*.py" = [
    "PTH",    # pathlib n'existe pas sur MicroPython
    "UP006",  # garde typing.List / Dict / Tuple au lieu de list[...]
    "UP007",  # garde Union[X, Y] au lieu de X | Y
    "UP015",  # autorise le mode explicite "r" dans open()
    "UP032",  # interdit les f-strings (absentes de MicroPython 1.9.4)
    "UP035",  # garde les imports depuis typing
    "UP045",  # garde Optional[X] au lieu de X | None
    "RUF005", # MicroPython 1.9.4 no support unpacking `*x` in a literal (PEP 448)
]
# Parseur de nomenclature organique : variables préparatoires inutilisées.
"atomion/objets/molecule.py" = ["F841"]
# `Equation.__eq__` compare à une chaîne : pas de `__hash__` cohérent possible.
"atomion/utile/equation.py" = ["PLW1641"]

[tool.coverage.run]
source = ["atomion"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
